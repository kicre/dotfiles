[main]
include = "~/.config/fuzzel/colors.ini"

# ── 字体 ──────────────────────────────────────────────
font=monospace:size=12
use-bold=no

# ── 提示符 ────────────────────────────────────────────
prompt="   "
# placeholder=搜索应用...
icon-theme=Tela-circle

# ── 搜索行为 ──────────────────────────────────────────
fields=filename,name,generic,keywords
match-mode=fzf
sort-result=yes
match-counter=no
delayed-filter-ms=120

# ── 终端 ──────────────────────────────────────────────
terminal=ghostty -e

# ── 窗口布局 ──────────────────────────────────────────
# 居中弹出，类似 Spotlight / Rofi 风格
anchor=center
width=52
lines=12
horizontal-pad=36
vertical-pad=18
inner-pad=8
line-height=28
letter-spacing=0.3

# ── 渲染 ──────────────────────────────────────────────
scaling-filter=lanczos3
image-size-ratio=0.45
layer=overlay
exit-on-keyboard-focus-loss=yes

# ── 圆角边框 ──────────────────────────────────────────
[border]
width=2
radius=16

# ── 按键绑定 ──────────────────────────────────────────
# Vim 风格 + 现代快捷键
[key-bindings]
prev=Control+k Up Control+p
next=Control+j Down Control+n
cursor-left=Left Control+b
cursor-right=Right Control+f
cursor-home=Home Control+a
cursor-end=End Control+e
delete-prev=BackSpace
delete-prev-word=Mod1+BackSpace Control+BackSpace
delete-next=Delete Control+d
delete-line-forward=none
execute=Return KP_Enter Control+l
cancel=Escape Control+g Control+c
