# Markdown

[[language]]
name = "markdown"
soft-wrap.enable = true
text-width = 80
soft-wrap.wrap-at-text-width = true

# Typst

[[language]]
name = "typst"
text-width = 80
soft-wrap.wrap-at-text-width = true
soft-wrap.enable = true
language-servers = [ "tinymist", "ltex-ls" ]

# JS

[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[[language]]
name = "javascript"
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome" ]
auto-format = true

[[language]]
name = "typescript"
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome" ]
auto-format = true

[[language]]
name = "tsx"
auto-format = true
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome" ]

[[language]]
name = "jsx"
auto-format = true
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome" ]

[[language]]
name = "jsonc"
file-types = ["json", "jsonc"]
language-servers = [ { name = "vscode-json-language-server", except-features = [ "format" ] }, "biome" ]

# MatLab

[language-server.matlab-ls]
command = "matlab-language-server"
args = ["--stdio"]

[language-server.matlab-ls.config.MATLAB]
indexWorkspace = false
#installPath = "/PATH/TO/MATLAB/INSTALLATION"
matlabConnectionTiming = "onStart"
telemetry = false

[[language]]
name = "matlab"
scope = "source.m"
file-types = ["m"]
language-servers = ["matlab-ls"]
comment-token = "%"
shebangs = ["octave-cli", "matlab"]
indent = { tab-width = 2, unit = "  " }

# Hyprlang
[[language]]
name = "hyprlang"
language-servers = [ "hyprls" ]
[language-server.hyprls]
command = "hyprls"

# Kdl
[[language]]
name = "kdl"
language-servers = [ "kdl-lsp" ]

[language-server.kdl-lsp]
command = "kdl-lsp"
