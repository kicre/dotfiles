schema:
  schema_id: ascii
  name: ASCII

engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - recognizer
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator

switches:
  - name: ascii_mode
    reset: 1
    states: ["ASCII"]

ascii_composer:
  switch_key":
    Shift_L: noop
    Shift_R: noop
    Caps_Lock: noop
